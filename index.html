<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> cưng cửng chưa thằng em !</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.5s ease-in-out;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff6b6b;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        h1 {
            color: #d63031;
            font-size: 28px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #ff7675;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        p {
            color: #2d3436;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
        }

        /* Bong bóng bay background */
        .balloon {
            position: absolute;
            width: 30px;
            height: 40px;
            border-radius: 50%;
            bottom: -100px;
            animation: float 8s infinite ease-in;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" alt="Trần Bình" class="avatar">
        
        <h1>Chúc Mừng !</h1>
        <div class="subtitle">🎉 Thằng ất ấn vào 🎉</div>
        
        <p id="wish-text">
            Chúc <b> THG ẤT </b> sóc lọ ! 🎂✨
        </p>

        <button class="btn" onclick="celebrate()">Bấm để nhận quà! 🎁</button>
    </div>

    <audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <script>
        // Tạo bóng bay ngẫu nhiên
        function createBalloons() {
            const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe'];
            for (let i = 0; i < 25; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDelay = Math.random() * 5 + 's';
                balloon.style.animationDuration = (Math.random() * 5 + 5) + 's';
                document.body.appendChild(balloon);
            }
        }

        // Tương tác khi bấm nút
        function celebrate() {
            // Phát nhạc
            const audio = document.getElementById('bg-music');
            audio.play();

            // Đổi lời chúc
            document.getElementById('wish-text').innerHTML = 
                "🥳 <b>ất ! 🚀🎈";
            
            alert('🎉 ngu mới bấm vô ');
        }

        // Chạy hiệu ứng khi tải trang
        createBalloons();
    </script>
</body>
</html>
